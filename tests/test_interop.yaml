- name: Stats2interop NextSeq relative path
  tags:
    - task_level
    - interop
    - relative
  # With inDir relative to 'FastQs' (to reproduce usage in 'Exome.wdl')
  command: miniwdl run -d out-miniwdl/. --no-cache --verbose --no-quant-check --cfg tests/sing.cfg --input tests/interop/common_inputs.json --task interop2stats interop.wdl seqDir=/mnt/chu-ngs/NEXTSEQ/runs/240905_NB501631_0204_AHVKN5BGXW/FastQs/../
  files:
    - path: out-miniwdl/out/outFile/sequencing.interop.tsv
      should_exist: true
      md5sum: 7be6cd5fc6e23ec7c2909d9fcdb057dc

- name: Stats2interop NextSeq absolute path
  tags:
    - task_level
    - interop
    - absolute
  command: miniwdl run -d out-miniwdl/. --no-cache --verbose --no-quant-check --cfg tests/sing.cfg --input tests/interop/common_inputs.json --task interop2stats interop.wdl seqDir=/mnt/chu-ngs/NEXTSEQ/runs/240905_NB501631_0204_AHVKN5BGXW/
  files:
    - path: out-miniwdl/out/outFile/sequencing.interop.tsv
      should_exist: true
      md5sum: 7be6cd5fc6e23ec7c2909d9fcdb057dc

- name: Stats2interop NextSeq dont exist
  tags:
    - task_level
    - interop
    - dontexist
  # Give a run path that does NOT exist
  command: miniwdl run -d out-miniwdl/. --no-cache --verbose --no-quant-check --cfg tests/sing.cfg --input tests/interop/common_inputs.json --task interop2stats interop.wdl seqDir=/path/dont/exist/FastQs/../
  files:
    - path: out-miniwdl/out/outFile/sequencing.interop.tsv
      should_exist: false
    - path: out-miniwdl/stdout.txt
      contains:
        - "WARNING: '/path/dont/exist/FastQs/../' dir NOT FOUND"

- name: Stats2interop NextSeq exist NO InterOp
  tags:
    - task_level
    - interop
    - nointerop
  # Give a run invalid for InterOp
  command: miniwdl run -d out-miniwdl/. --no-cache --verbose --no-quant-check --cfg tests/sing.cfg --input tests/interop/common_inputs.json --task interop2stats interop.wdl seqDir=/home
  files:
    - path: out-miniwdl/out/outFile/sequencing.interop.tsv
      should_exist: false
    - path: out-miniwdl/stderr.txt
      contains:
        - "ERROR: '/home' is invalid for InterOP lib"
