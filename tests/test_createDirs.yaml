- name: CreateParentDir sampleName collision
  # With 'HG002', 'HG002*' glob matches both 'full' and 'chr22' ones
  tags:
    - task_level
    - parent
    - collision
  command: miniwdl run -d out-miniwdl/. --no-cache --verbose --no-quant-check --cfg tests/sing.cfg --input tests/createdirs/common_inputs.json --task CreateParentDir temp.wdl parent=HG002
  exit_code: 1  # Real error, independant from MiniWDL
  stderr:
    contains:
      - "ln: target './/out-cromwell/Parent/HG002/HG002.R1.fastq.gz' is not a directory"
  # These dir are created anyway:
  files:
    - path: out-miniwdl/work/out-cromwell/Parent/HG002/Metrix
    - path: out-miniwdl/work/out-cromwell/Parent/HG002/Alignement

