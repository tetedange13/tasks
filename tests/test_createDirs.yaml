# /!\ Before running tests: put tasks 'CreateCIDir' and 'CreateParentDir' (from Exome.wdl) in a 'temp.wdl file

- name: CreateParentDir
  tags:
    - task_level
    - parent
  command: miniwdl run -d out-miniwdl/. --no-cache --verbose --no-quant-check --cfg tests/sing.cfg --input tests/createdirs/common_inputs.json --task CreateParentDir temp.wdl parent=A161161
  exit_code: 2  # MiniWDL does NOT allow subdirs in 'work' -> will always return error (see: https://github.com/chanzuckerberg/miniwdl/issues/214)
  files:
  # Task produce symlinks of FASTQ + specific (empty) directories tree:
    - path: out-miniwdl/work/out-cromwell/Parent/A161161/A161161.R1.fastq.gz
      should_exist: true
      md5sum: adf575f603040535a6021d7ba6fb13ab
    - path: out-miniwdl/work/out-cromwell/Parent/A161161/A161161.R2.fastq.gz
      should_exist: true
      md5sum: 5e367b3dca4247d13f8938b3461d4309
    - path: out-miniwdl/work/out-cromwell/Parent/A161161/Metrix
    - path: out-miniwdl/work/out-cromwell/Parent/A161161/Alignement

- name: CreateParentDir fastqDir dont exist
  tags:
    - task_level
    - parent
    - dontexist
  command: miniwdl run -d out-miniwdl/. --no-cache --verbose --no-quant-check --cfg tests/sing.cfg --task CreateParentDir temp.wdl parent=A161161 FastqDir=/path/do/not/exist RunName=out-cromwell
  exit_code: 2  # MiniWDL does NOT allow subdirs in 'work' -> will always return error (see: https://github.com/chanzuckerberg/miniwdl/issues/214)
  files:
  # Task produce symlinks of FASTQ + specific (empty) directories tree:
    # MEMO: Symlink on 'non-existent file' raise NO Bash error
    #       But with broken symlinks, 'should_exist' condition is 'false'
    - path: out-miniwdl/work/out-cromwell/Parent/A161161/A161161.R1.fastq.gz
      should_exist: false
    - path: out-miniwdl/work/out-cromwell/Parent/A161161/A161161.R2.fastq.gz
      should_exist: false
    - path: out-miniwdl/work/out-cromwell/Parent/A161161/Metrix
    - path: out-miniwdl/work/out-cromwell/Parent/A161161/Alignement

- name: CreateParentDir sample dont exist
  # FastqDir is valid, but parent do not
  tags:
    - task_level
    - parent
    - dontexist
  command: miniwdl run -d out-miniwdl/. --no-cache --verbose --no-quant-check --cfg tests/sing.cfg --input tests/createdirs/common_inputs.json --task CreateParentDir temp.wdl parent=dontExist
  exit_code: 2  # MiniWDL does NOT allow subdirs in 'work' -> will always return error (see: https://github.com/chanzuckerberg/miniwdl/issues/214)
  files:
  # Task produce symlinks of FASTQ + specific (empty) directories tree:
    # MEMO: Symlink on 'non-existent file' raise NO Bash error
    #       But with broken symlinks, 'should_exist' condition is 'false'
    - path: out-miniwdl/work/out-cromwell/Parent/dontExist/dontExist.R1.fastq.gz
      should_exist: false
    - path: out-miniwdl/work/out-cromwell/Parent/dontExist/dontExist.R2.fastq.gz
      should_exist: false
    - path: out-miniwdl/work/out-cromwell/Parent/dontExist/Metrix
    - path: out-miniwdl/work/out-cromwell/Parent/dontExist/Alignement

