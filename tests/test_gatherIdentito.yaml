- name: Gather all identito files
  tags:
    - task_level
    - multiple
  # With Miniwdl, inputs arrays are specified as 'my_array=value_1 my_array=value_2'
  # -> Use an intermediate input JSON to shorten cmd ?
  command: miniwdl run -d out-miniwdl/. --no-cache --verbose --no-quant-check --cfg tests/sing.cfg --input tests/gatherIdentito/common_inputs.json --task gatherIdentito temp.wdl filesToGather=tests/gatherIdentito/casIndex/casIndex1/Metrix/casIndex1.Identito.tsv filesToGather=tests/gatherIdentito/casIndex/casIndex2/Metrix/casIndex2.Identito.tsv filesToGather=tests/gatherIdentito/casIndex/casIndex3/Metrix/casIndex3.Identito.tsv
  files:
    - path: out-miniwdl/out/outFile/all_casIndex.identito.tsv
      should_exist: true
      md5sum: af1d4b46094d2545bd86796326f10e12

- name: Gather all identito files to outputPath
  tags:
    - task_level2
    - multiple
  command: miniwdl run -d out-miniwdl/. --no-cache --verbose --no-quant-check --cfg tests/sing.cfg --input tests/gatherIdentito/common_inputs.json --task gatherIdentito temp.wdl outputPath=tests/gatherIdentito filesToGather=tests/gatherIdentito/casIndex/casIndex1/Metrix/casIndex1.Identito.tsv filesToGather=tests/gatherIdentito/casIndex/casIndex2/Metrix/casIndex2.Identito.tsv filesToGather=tests/gatherIdentito/casIndex/casIndex3/Metrix/casIndex3.Identito.tsv
  files:
    - path: out-miniwdl/work/tests/gatherIdentito/all_casIndex.identito.tsv
      should_exist: true
      md5sum: af1d4b46094d2545bd86796326f10e12  # Should be identical to above test

- name: Gather single identito
  tags:
    - task_level
    - single
  command: miniwdl run -d out-miniwdl/. --no-cache --verbose --no-quant-check --cfg tests/sing.cfg --input tests/gatherIdentito/common_inputs.json --task gatherIdentito temp.wdl filesToGather=tests/gatherIdentito/casIndex/casIndex1/Metrix/casIndex1.Identito.tsv
  files:
    - path: out-miniwdl/out/outFile/all_casIndex.identito.tsv
      should_exist: true
      md5sum: b02227701978b953ac14b943f6326124
