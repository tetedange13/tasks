- name: Gather all identito files
  tags:
    - task_level
    - multiple
  # With Miniwdl, inputs arrays are specified as 'my_array=value_1 my_array=value_2'
  # -> Use an intermediate input JSON to shorten cmd ?
  command: miniwdl run -d out-miniwdl/. --no-cache --verbose --no-quant-check --cfg tests/sing.cfg --input tests/gatherIdentito/common_inputs.json --task gatherIdentito felix.wdl filesToGather=tests/gatherIdentito/casIndex/casIndex1/Metrix/casIndex1.Identito.tsv filesToGather=tests/gatherIdentito/casIndex/casIndex2/Metrix/casIndex2.Identito.tsv filesToGather=tests/gatherIdentito/casIndex/casIndex3/Metrix/casIndex3.Identito.tsv
  files:
    - path: out-miniwdl/out/outFile/all_casIndex.identito.tsv
      should_exist: true
      md5sum: 1d26be7978aeea3284042f5b603d0711

- name: Gather all identito files to outputPath
  tags:
    - task_level2
    - multiple
  command: miniwdl run -d out-miniwdl/. --no-cache --verbose --no-quant-check --cfg tests/sing.cfg --input tests/gatherIdentito/common_inputs.json --task gatherIdentito felix.wdl outputPath=tests/gatherIdentito filesToGather=tests/gatherIdentito/casIndex/casIndex1/Metrix/casIndex1.Identito.tsv filesToGather=tests/gatherIdentito/casIndex/casIndex2/Metrix/casIndex2.Identito.tsv filesToGather=tests/gatherIdentito/casIndex/casIndex3/Metrix/casIndex3.Identito.tsv
  files:
    - path: out-miniwdl/work/tests/gatherIdentito/all_casIndex.identito.tsv
      should_exist: true
      md5sum: 1d26be7978aeea3284042f5b603d0711

